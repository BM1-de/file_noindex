name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-qa-${{ hashFiles('composer.json') }}
      - run: composer update --no-interaction --no-progress
      - run: composer check:cs
      - run: composer check:phpstan

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', typo3: '^13.4' }
          - { php: '8.3', typo3: '^13.4' }
          - { php: '8.4', typo3: '^13.4' }
          - { php: '8.3', typo3: '^14.0' }
          - { php: '8.4', typo3: '^14.0' }
    name: "tests: PHP ${{ matrix.php }} / TYPO3 ${{ matrix.typo3 }}"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: intl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}
      - run: composer require "typo3/cms-core:${{ matrix.typo3 }}" --no-update --no-interaction
      - run: composer update --no-interaction --no-progress
      - run: composer show typo3/cms-core | grep ^versions
      - run: composer test:unit
      - run: typo3DatabaseDriver=pdo_sqlite composer test:functional
